<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Instagram Post</title>
</head>
<body>
    <div class="post">
        <div class="post-header">
            <div class="header-user">
                <div class="html-icon">
                    <i class="fa-brands fa-html5 icon-1"></i>
                    <p><strong>HMTL5</strong><br>Ruben</p>
                </div>
            </div>
            <div class="dots-icon">
                <i class="fa-solid fa-ellipsis-vertical dots"></i>
            </div>
        </div>
        <img src="football.jpg" alt="Footbal-Player">
        <div class="footer-header">
            <div class="likes-send">
             <i class="fa-regular fa-heart heart"></i>
             <i class="fa-regular fa-comment message"></i>
             <i class="fa-regular fa-paper-plane send"></i>
            </div>
            <div class="book">
                <i class="fa-regular fa-bookmark book"></i>
            </div> 
        </div>
        <div class="footer-text">
           <p>Likes by <strong>4geeks. html5, web</strong> and <strong>100.000 others</strong></p>
        </div>
        <div class="footer">
            Lorem ipsum dolor sit amet consectetur, adipisicing elit. Quis ipsum obcaecati cumque eius id facilis reiciendis tempore nostrum! Asperiores soluta est numquam assumenda hic nostrum sequi beatae nemo accusamus incidunt!
        </div>
    </div>
    
</body>
</html>
